<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <header class="hero">

        <h1>MotoAI</h1>

        <p class="subtitle">
            ИИ-помощник по мототехнике
        </p>

        <p class="description">
            Поможет с ремонтом, диагностикой, обслуживанием,
            выбором техники, подбором запчастей и ответит
            практически на любой вопрос.
        </p>

    </header>

    <main id="chat" class="chat"></main>

    <footer class="chatBox">

        <div class="inputBox">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Чем я могу помочь?"
                autocomplete="off"></textarea>

            <div class="buttons">

                <button id="photoButton" class="photoButton">

                    📷

                </button>

                <button id="sendButton" class="sendButton">

                    ↑

                </button>

            </div>

        </div>

    </footer>

    <div class="footerText">

        MotoAI может ошибаться. Проверяйте важную информацию.

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
