<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="topBar">

        <button id="shareButton" class="topButton" title="Поделиться">
            🔗
        </button>

        <a
        href="https://t.me/xleebuusheek"
        target="_blank"
        class="topButton"
        title="Telegram">

            ✈

        </a>

    </div>

   
<div class="chatHeader">
    MotoAI
</div>
    <div id="welcomeScreen" class="welcomeScreen">

<h2>С чего начнём?</h2>

<p>
    Задайте любой вопрос MotoAI.<br>
    Я помогу с техникой.
</p>

</div>

<main id="chat" class="chat">

    </main>

    <footer class="chatBox">

        <div class="inputBox">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Спросите MotoAI"
                autocomplete="off"></textarea>

            <div class="buttons">

                <button
                    id="photoButton"
                    class="photoButton"
                    title="Фото">

                    📷

                </button>

                <button
                    id="sendButton"
                    class="sendButton"
                    title="Отправить">

                    ↑

                </button>

            </div>

        </div>

    </footer>

    <div class="footerText">

        MotoAI может ошибаться. Проверяйте важную информацию.

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
