<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoAI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="hero">

        <h1>MotoAI</h1>

        <h2>ИИ-помощник по мототехнике</h2>

        <p>
            Поможет с диагностикой, ремонтом и обслуживанием вашей техники.
        </p>

    </div>

    <div class="chat">

        <div id="messages" class="messages"></div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Чем я могу помочь?"
                autocomplete="off">

            <button id="sendButton">
                ↑
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
